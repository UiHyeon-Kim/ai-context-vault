name: tests

# 단위 테스트와 격리된 Basic Memory MCP 연동 테스트를 실행한다.
# 주간 최신 버전 점검은 호환성 회귀를 감지할 뿐, 패키지나 사용자의 연결을 자동 업데이트하지 않는다.
# 임베딩 모델 다운로드·의미 검색 품질과 macOS의 실제 ChatGPT 터널 연결은 이 CI가 검증하지 않는다.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # 월요일 10:00 KST, 최신 버전 호환성 점검

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  integration:
    # Basic Memory를 실제로 설치해 scripts/demo_roundtrip.py와 scripts/mcp_stdio_check.py를 실행한다.
    # 1.0.0(Ubuntu)을 필수 계약으로 검증한다. 구버전 및 PR의 latest는 참고 시험이다.
    # 주간 예약 실행에서 latest 실패는 워크플로 실패로 보고해 호환성 변화를 알린다.
    name: integration (${{ matrix.os }}, basic-memory ${{ matrix.bm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental && !(github.event_name == 'schedule' && matrix.bm == 'latest') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bm: "1.0.0", experimental: false }
          - { os: ubuntu-latest, bm: "0.22.1", experimental: true }
          - { os: windows-latest, bm: "0.22.1", experimental: true }
          - { os: ubuntu-latest, bm: "latest", experimental: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Basic Memory
        shell: bash
        run: |
          if [ "${{ matrix.bm }}" = "latest" ]; then spec="basic-memory"; else spec="basic-memory==${{ matrix.bm }}"; fi
          python -m pip install "$spec"
          basic-memory --version
      - name: 격리 재현 (텍스트 검색·기록, 오프라인)
        run: python scripts/demo_roundtrip.py --offline
      - name: MCP stdio 계층 (오프라인)
        if: ${{ !cancelled() }}
        run: python scripts/mcp_stdio_check.py --offline
