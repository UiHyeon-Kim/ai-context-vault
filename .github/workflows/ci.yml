name: tests

# 표준 라이브러리 단위 테스트만 실행한다. Basic Memory 설치나 실제 MCP 호출은 하지 않는다
# (그 시험은 scripts/demo_roundtrip.py, scripts/mcp_stdio_check.py를 로컬에서 실행).
# macOS는 비공개 저장소에서 러너 사용량 배수가 커서 제외했고 로컬(macOS)에서 직접 검증했다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
